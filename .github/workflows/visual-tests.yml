name: Visual Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate baseline snapshots and commit them back'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  visual-test:
    runs-on: ubuntu-latest
    # Backstop: a healthy run takes ~2 minutes.  Without this, a hung step runs
    # until GitHub's 6-hour job limit (see the apt stalls that motivated the
    # step timeouts below) instead of failing fast and visibly.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref }}

      - name: Init fmin submodule
        run: git submodule update --init web/src/lib/fmin

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.*

      - name: Install .NET dependencies
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build Fable
        run: dotnet fable src/explorer --outDir web/src/lib/fable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Node dependencies
        run: cd web && npm ci

      - name: Install Playwright browsers
        # No --with-deps: that flag shells out to apt-get, which is where this
        # job has hung (twice for over an hour, on two different runners).  The
        # ubuntu-latest image already ships Chromium's system libraries, so the
        # browser download alone is enough — and it normally takes ~20s.
        timeout-minutes: 5
        run: cd web && npx playwright install chromium

      - name: Build web app
        run: cd web && npm run build

      - name: Run visual tests
        run: cd web && npm run test:visual${{ inputs.update_snapshots && ':update' || '' }}

      - name: Commit updated snapshots
        if: inputs.update_snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/tests/*-snapshots/* 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Update visual regression snapshots"
            git push
          fi

      - name: Commit new baselines
        if: always() && !inputs.update_snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/tests/*-snapshots/* 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new baselines to commit."
          else
            git commit -m "Add new visual regression baselines"
            git push
          fi

      - name: Install ImageMagick for diff GIFs
        # Only the diff-GIF step below uses `convert` and the DejaVu font, and it
        # only runs on failure — so installing these unconditionally put an
        # apt-get on the happy path for nothing.  It is not worth failing an
        # already-failing run over, hence continue-on-error: the PNGs still
        # upload even if this cannot install.
        if: failure()
        continue-on-error: true
        timeout-minutes: 10
        run: sudo apt-get install -y imagemagick fonts-dejavu-core

      - name: Generate failure diff GIFs
        if: failure()
        run: |
          mkdir -p web/test-results/diffs
          find web/test-results -name '*-actual.png' | while IFS= read -r actual; do
            expected="${actual%-actual.png}-expected.png"
            [ -f "$expected" ] || continue
            name=$(basename "${actual%-actual.png}")
            convert "$expected" \
              -fill 'rgba(0,0,0,0.75)' -draw 'rectangle 0,0 150,44' \
              -fill white -font DejaVu-Sans-Bold -pointsize 24 \
              -gravity NorthWest -annotate +8+6 'BEFORE' \
              /tmp/frame-before.png
            convert "$actual" \
              -fill 'rgba(0,0,0,0.75)' -draw 'rectangle 0,0 150,44' \
              -fill white -font DejaVu-Sans-Bold -pointsize 24 \
              -gravity NorthWest -annotate +8+6 'AFTER' \
              /tmp/frame-after.png
            convert -delay 100 /tmp/frame-before.png \
                    -delay 100 /tmp/frame-after.png \
                    -loop 0 "web/test-results/diffs/${name}.gif"
            echo "Generated diff: ${name}.gif"
          done
          echo "Failure diffs:"
          ls web/test-results/diffs/ 2>/dev/null || echo "(none)"

      - name: Upload screenshots on failure
        if: failure()
        id: artifact-upload
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: |
            web/tests/**/*-snapshots/
            web/test-results/
            web/playwright-report/
          retention-days: 7

      - name: Log artifact URL
        if: failure()
        run: echo "Diff GIFs and screenshots uploaded. Download at ${{ steps.artifact-upload.outputs.artifact-url }}"
